[project]
name = "dgpu"
version = "0.1.0"
description = "一条命令在按需云 GPU（Vast.ai、AutoDL）上训练任意模型，用完自动销毁"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1,<9",
    "pyyaml>=6,<7",
    "boto3>=1.35,<2",
    "httpx>=0.27,<1",
]

[project.scripts]
dgpu = "dgpu.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.8",
    "moto[s3]>=5,<6",
    "respx>=0.21,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dgpu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# 随 bundle 下发到实例的代码要兼容 Python 3.8，不做语法升级
"src/dgpu/runner/*" = ["UP"]
"src/dgpu/layout.py" = ["UP"]
"src/dgpu/states.py" = ["UP"]
"src/dgpu/__init__.py" = ["UP"]
